<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Block scene GLB viewer</title>
    <style>
      :root { color: #211927; background: #f4f1ea; font-family: Inter, ui-sans-serif, sans-serif; }
      body { margin: 0; }
      header { padding: 14px 18px 0; max-width: 1100px; }
      h1 { font-size: 18px; margin: 0 0 6px; font-weight: 600; }
      p { margin: 0; font-size: 13px; line-height: 1.45; max-width: 78ch; }
      .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 18px; font-size: 13px; }
      .stage { display: grid; grid-template-columns: 1fr 1.2fr; gap: 12px; padding: 0 18px 18px; align-items: start; }
      .stage:has(#reference[hidden]) { grid-template-columns: 1fr; }
      img, canvas { width: 100%; border-radius: 8px; background: #2a2a2e; display: block; }
      canvas { height: 640px; }
      figcaption { font-size: 12px; margin-top: 4px; }
      figure:has(img[hidden]) { display: none; }
      #stats { font-variant-numeric: tabular-nums; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <header>
      <h1>Generated block-scene GLB</h1>
      <p>
        Isolated viewer. It draws the file's own triangles with a plain gray material.
        It does not voxelize, fill columns, or invent a mesh. Orbit the volume that is actually in the GLB.
      </p>
    </header>
    <div class="row">
      <label>GLB <input id="file" type="file" accept=".glb,.gltf,model/gltf-binary" /></label>
      <label>Mais simples <input id="detail" type="range" min="0" max="4" step="1" value="4" /> Mais detalhado</label>
      <button id="front" type="button">Frente</button>
      <button id="reset" type="button">Repor</button>
      <button id="capture" type="button">Guardar vista</button>
      <span id="status">Waiting for the Hunyuan GLB. No geometry is invented.</span>
      <span id="stats"></span>
    </div>
    <div class="stage">
      <figure>
        <img id="reference" alt="Referência 2D" hidden />
        <figcaption>Referência 2D, não é o modelo</figcaption>
      </figure>
      <figure>
        <canvas id="view"></canvas>
        <figcaption>Malha gerada, vista atual</figcaption>
      </figure>
    </div>
    <script type="module" src="./viewer.js"></script>
  </body>
</html>
